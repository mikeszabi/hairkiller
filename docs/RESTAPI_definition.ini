# HairKiller REST API Definition
#
# Backend: backend/hk_backend_app.py
# Mock backend: backend/hk_backend_mock_app.py
# Base URL: http://localhost:8000
# API prefix: every API route also works under /api, e.g. /api/health.
#
# Most POST endpoints use query parameters. JSON bodies are used by:
# - POST /app/raw_command
# - POST /laser/settings
# - POST /camera/settings
#

[frontends]
GET /                                  = legacy/root full app HTML
GET /hk_full_app_check.html            = full backend preflight/status UI
GET /hk_treatment_app_portrait.html    = simplified treatment-only portrait UI

[diagnostics]
GET /health                            = camera and hardware readiness
GET /stats                             = camera, stream, detection, and app runtime stats
GET /frame/meta                        = latest native/stream frame metadata
GET /frame/current                     = multipart MJPEG stream with optional overlays
GET /frame/snapshot                    = latest JPEG snapshot
GET /diagnostics/full_app_check        = run backend preflight script
POST /latency/benchmark                = camera/backend latency benchmark

[camera]
GET /camera/settings                   = read camera settings
POST /camera/settings                  = apply camera settings JSON body
GET /camera/frame_stride               = read frame stride
POST /camera/frame_stride?value=2      = set frame stride

[application_and_firmware]
GET /app/errors                        = app state, app last error, async error events
GET /app/errors/events                 = async app error events only
POST /app/errors/clear                 = APP_CLEAR_ERROR and clear stored async events
GET /app/test/status                   = firmware test/watchdog status
GET /app/test/events                   = firmware test/watchdog async events
POST /app/ping                         = APP_PING
GET /app/commands                      = raw command list from firmware
GET /app/command_catalog               = backend command metadata catalog
GET /app/command_info?command=...      = metadata for one command
GET /app/limits                        = APP_GET_LIMITS
POST /app/reset                        = APP_RESET
POST /startup/clean_state              = clean startup state: detection off, laser disarmed, target/app errors cleared, target list cleared
GET /app/proc_time                     = APP_GET_PROC_TIME
POST /app/laser_test/start             = start firmware laser power test
GET /app/laser_test/result             = read laser test result
GET /app/laser_test/data               = read laser test samples
GET /app/fw_version                    = firmware version
GET /app/hw_version                    = hardware version
GET /app/state                         = APP_GET_STATE
GET /app/last_error                    = APP_GET_LAST_ERROR
POST /app/clear_error                  = APP_CLEAR_ERROR
POST /app/raw_command                  = send raw serial command, JSON {"command":"..."}

[vacuum]
POST /vacuum/on                        = switch vacuum output on
POST /vacuum/off                       = switch vacuum output off
POST /vacuum/check?enabled=true        = enable/disable firmware vacuum safety check
GET /vacuum/check                      = read firmware vacuum safety check flag
GET /vacuum/status                     = read vacuum output and check-vacuum state

[treatment_core]
GET /treatment/status                  = treatment mode/runtime status
GET /treatment/mode                    = alias for treatment status
POST /treatment/mode?mode=semi_auto    = set mode: auto, semi_auto, manual
POST /treatment/start                  = legacy treatment start; auto mode is vacuum-triggered
POST /treatment/next                   = legacy manual next target
POST /treatment/stop                   = halt treatment and clear manual runtime state

[treatment_portrait_app]
GET /treatment/app/status              = compact state snapshot for treatment-only UI; intentionally button-driven
POST /treatment/app/mode?mode=...      = set treatment UI mode: auto, semi_auto, manual
POST /treatment/app/detect             = SEMI/MANUAL phase 1: capture or reuse live-cache detections and upload target list
POST /treatment/app/fire               = SEMI phase 2: safety check and TARGET_START on already-loaded targets
POST /treatment/app/next               = MANUAL phase 2: fire or continue next target
POST /treatment/app/emergency_stop     = target halt/stop, laser stop/disarm, vacuum off, cleanup states
POST /treatment/app/settings?p808=20&p980=25&p1064=50&pulse_ms=50
                                      = set treatment power/pulse and reload already-loaded targets

[target_sequence]
GET /seq/status                        = target state, mode, last error, loaded target count, sequence events
GET /seq/events                        = target sequence async events
POST /seq/length?length=10             = adjust local target length
POST /seq/target?idx=0&x=2000&y=2000   = set local target point
POST /seq/show_targets?enabled=true    = show/hide loaded target overlay on camera stream
POST /seq/update_targets               = build targets from current detected points and upload to controller
POST /seq/clear_targets                = clear loaded targets
POST /seq/mode?mode=auto               = set target mode: auto/all or manual/single/step
GET /seq/mode                          = read target mode
POST /seq/start                        = TARGET_START
POST /seq/start_test                   = TARGET_START test alias
POST /seq/stop                         = TARGET_STOP
POST /seq/halt                         = TARGET_HALT
POST /seq/step                         = manual step/continue

[detection_and_points]
POST /detection/toggle?enabled=true    = enable/disable background YOLO detection
GET /detection/status                  = detection, threshold, red-dot, overlay, HSV settings
POST /detection/conf?conf=0.25         = set detection threshold, clamped to 0.01..1.0
POST /detection/live_overlay?enabled=true
                                      = draw/hide live YOLO boxes on /frame/current while detection keeps running
POST /detection/capture                = synchronous detection on latest frame
GET /points/list                       = current captured point list
POST /points/clear                     = clear captured point list

[calibration_and_red_dot]
POST /calibration/detection/toggle?enabled=true
                                      = enable calibration red-dot detection and red dot
POST /detection/mask_overlay?enabled=true
                                      = show/hide red-dot HSV mask overlay
GET /detection/hsv                     = read red-dot HSV thresholds
POST /detection/hsv?...                = set red-dot HSV thresholds
GET /dot                               = detect current red dot
GET /frame/hsv?x=100&y=100             = inspect HSV/BGR at stream point
GET /sse/dot                           = SSE stream for red-dot position changes
POST /calibration/start                = clear calibration points
POST /calibration/store                = store current red-dot/camera/galvo pair
GET /calibration/points                = list calibration points
POST /calibration/save                 = calculate and save homography
POST /homography/reload                = reload transformation_matrix.txt

[galvo_and_coordinates]
GET /sse/galvo_pos                     = SSE stream for galvo position changes
GET /mover/pos                         = read galvo position
POST /mover/move?x=2000&y=2000         = move galvo to raw position
POST /mover/direction?direction=up&step=25
                                      = jog galvo
POST /mover/move_image?x=480&y=480     = stream-coordinate click to native image to galvo
GET /coords/convert?ix=960&iy=960      = native image coordinate to galvo coordinate
POST /walk/start                       = walk through detected points
POST /walk/stop                        = stop walking
POST /fire/walk?test_mode=false        = legacy detected-points fire/walk flow

[laser]
POST /laser/arm_en?enabled=true        = set arm flag directly
GET /laser/arm_en                      = read arm flag
POST /laser/arm                        = enable peltier if needed, then arm
POST /laser/disarm                     = disarm
POST /laser/ack                        = acknowledge laser errors
POST /laser/clear_error                = LASER_CLEAR_ERROR
GET /laser/last_error                  = LASER_GET_LAST_ERROR
POST /laser/pwr?laser_id=4&pwr=20      = set legacy power channel
POST /laser/channel_pwr?p808=20&p980=25&p1064=50
                                      = set 808/980/1064 power percent
GET /laser/channel_pwr                 = read channel power
POST /laser/active?l1064=1&l980=1&l808=1&l660=0
                                      = set active laser channels and optional red dot
POST /laser/current?curr=20            = set same current/power for active channels
GET /laser/temp                        = read laser temperature
GET /sensors/values                    = parsed sensor snapshot
POST /laser/pulse?pulse_ms=50          = set target pulse width
GET /laser/settings                    = combined arm/power/pulse/settings view
POST /laser/settings                   = JSON laser settings update, optionally reload targets
POST /laser/red_dot?enabled=true       = set red dot
POST /laser/red_dot_en?enabled=true    = set red dot enable flag
GET /laser/red_dot_en                  = read red dot enable flag
POST /laser/fire?duration_ms=50        = single fire pulse
POST /laser/stop                       = stop active laser output
GET /laser/is_active                   = read active laser output flag
GET /laser/state                       = LASER_GET_STATE

[performance_notes]
DETECT                                = fastest when /detection/toggle is on; treatment detect then reuses live cache
FIRE                                  = avoids full state fan-out; explicit CHECK STATES uses /treatment/app/status
target_upload                         = one serial command per target; tune HK_TARGET_LOAD_WAIT_S and HK_TARGET_LOAD_READ_WINDOW_S
status_queries                        = serial queries wait for read windows; do not poll on operator UI
